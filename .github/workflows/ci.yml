name: CI

on:
  push:
    branches: [main, master, rearchitecture]
  pull_request:
    branches: [main, master, rearchitecture]

jobs:
  check:
    name: Type Check, Lint & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Type check contract (TypeScript 7 native)
        run: npm run typecheck:contract

      - name: Type check (TypeScript 7 native)
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test with coverage
        run: npm run test:coverage

      - name: Coverage summary
        if: always()
        run: |
          node -e "const s=require('./coverage/coverage-summary.json').total; let o='### Coverage (src/lib)\n\n| metric | % | covered/total |\n|---|---|---|\n'; for (const k of ['lines','statements','functions','branches']) o+='| '+k+' | '+s[k].pct+'% | '+s[k].covered+'/'+s[k].total+' |\n'; require('fs').appendFileSync(process.env.GITHUB_STEP_SUMMARY, o);"

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          retention-days: 14

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: check

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npx next build
        env:
          # Skip telemetry during build
          NEXT_TELEMETRY_DISABLED: 1

  security:
    name: Vulnerability Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Audit report (all severities, informational)
        if: always()
        run: |
          npm audit --json > audit.json || true
          node -e "const v=require('./audit.json').metadata.vulnerabilities; let o='### npm audit\n\n| severity | count |\n|---|---|\n'; for (const k of ['critical','high','moderate','low','info']) o+='| '+k+' | '+(v[k]||0)+' |\n'; o+='| **total** | **'+v.total+'** |\n'; require('fs').appendFileSync(process.env.GITHUB_STEP_SUMMARY, o);"

      - name: Fail on production critical vulnerabilities
        run: npm audit --omit=dev --audit-level=critical
