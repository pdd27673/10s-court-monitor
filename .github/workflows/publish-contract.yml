name: Publish contract

on:
  push:
    tags:
      - "contract-v*"

jobs:
  publish:
    name: Publish @pdd27673/10s-contract
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://npm.pkg.github.com"
          scope: "@pdd27673"

      - name: Set version from tag
        working-directory: packages/contract
        run: |
          VERSION="${GITHUB_REF_NAME#contract-v}"
          # --allow-same-version: the committed package.json version usually already
          # matches the tag (idempotent), so npm mustn't error with "Version not changed".
          npm version "$VERSION" --allow-same-version --no-git-tag-version

      - name: Publish
        working-directory: packages/contract
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
