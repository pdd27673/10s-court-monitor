# Nixpacks configuration for Railway
# python3/gcc/gnumake remain for better-sqlite3 (used only by the one-off
# sqlite->postgres data-migration + legacy watch-migration scripts).

[phases.setup]
nixPkgs = ["nodejs_24", "python3", "gcc", "gnumake"]

[phases.install]
cmds = ["npm ci --include=dev"]

[phases.build]
cmds = ["npm run build"]

# db:migrate runs at deploy time (railway.json startCommand), where DATABASE_URL
# is available — not at build time.
[start]
cmd = "npm run db:migrate && npm start"
