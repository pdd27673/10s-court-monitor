<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="1.2" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect
    width="100"
    height="100"
    rx="22"
    fill="#0b1b11"
    stroke="#22c55e"
    stroke-opacity="0.3"
    stroke-width="2"
  />
  <g
    fill="none"
    stroke="#22c55e"
    stroke-opacity="0.35"
    stroke-width="4"
    stroke-linecap="round"
    stroke-linejoin="round"
  >
    <rect x="20" y="16" width="60" height="68" rx="2"/>
    <line x1="20" y1="50" x2="80" y2="50"/>
    <line x1="50" y1="16" x2="50" y2="50"/>
    <line x1="50" y1="50" x2="50" y2="84"/>
  </g>
  <g
    fill="none"
    stroke="#22c55e"
    stroke-width="2.8"
    stroke-linecap="round"
    stroke-linejoin="round"
    filter="url(#glow)"
  >
    <rect x="20" y="16" width="60" height="68" rx="2"/>
    <line x1="20" y1="50" x2="80" y2="50"/>
    <line x1="50" y1="16" x2="50" y2="50"/>
    <line x1="50" y1="50" x2="50" y2="84"/>
  </g>
</svg>
